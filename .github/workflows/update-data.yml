name: 実データを取得して公開

on:
  schedule:
    - cron: '0 22 * * 0-4'   # 月〜金 07:00 JST（前日分の終値を取り込む）
  workflow_dispatch:          # 手動実行（Actions タブの「Run workflow」）
  push:
    branches: [claude/stock-investment-beginner-app-dbdih3, main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 実データを取得（登録不要・Yahoo Finance）
        run: npm run fetch-data
      - name: 取得した実データをリポジトリに保存（Claude側で同じURLを更新するため）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f src/data/snapshot/stocks.json
          git commit -m "実データを更新 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "変更なし"
          git push
      - name: ビルド
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
